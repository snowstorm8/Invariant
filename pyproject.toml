[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "invariant"
version = "0.1.0"
description = "Property-based testing of security invariants (authorization and tenant isolation) in web applications."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "hypothesis>=6.100",
    "httpx>=0.27",
    "pydantic>=2.6",
    "typer>=0.12",
]

[project.optional-dependencies]
# The deliberately vulnerable demonstration application.
demo = ["fastapi>=0.110"]
dev = ["fastapi>=0.110", "pytest>=8", "mypy>=1.10"]

[project.scripts]
invariant = "invariant.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src/invariant"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# `examples/` holds the demo app (imported as `vulnerable_saas`).
pythonpath = ["examples", "tests"]
filterwarnings = ["ignore:Using .httpx. with"]
addopts = "-ra"

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/invariant", "examples/vulnerable_saas"]
mypy_path = "src:examples"
explicit_package_bases = true
