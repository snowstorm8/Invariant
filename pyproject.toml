[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "invariant"
version = "0.1.0"
description = "Property-based testing of security invariants (authorization and tenant isolation) in web applications."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "hypothesis>=6.100",
    "httpx>=0.27",
    "pydantic>=2.6",
    "typer>=0.12",
]

[project.optional-dependencies]
# The deliberately vulnerable demonstration application.
demo = ["fastapi>=0.110", "uvicorn>=0.30"]
dev = ["fastapi>=0.110", "uvicorn>=0.30", "pytest>=8", "mypy>=1.10", "ruff>=0.5"]

[project.scripts]
invariant = "invariant.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src/invariant"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# `examples/` holds the demo apps (imported as `vulnerable_saas` and, from its folder, `meridian`).
pythonpath = ["examples", "examples/meridian_docs", "tests"]
filterwarnings = ["ignore:Using .httpx. with"]
addopts = "-ra"

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/invariant", "examples/vulnerable_saas", "examples/meridian_docs"]
mypy_path = "src:examples:examples/meridian_docs"
explicit_package_bases = true

[tool.ruff]
target-version = "py312"
line-length = 110
src = ["src", "examples", "tests"]

[tool.ruff.lint]
# pyflakes, pycodestyle, import order, pyupgrade, bugbear, simplify, unused arguments off
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "RUF100"]
ignore = ["E501", "B008", "SIM108"]
